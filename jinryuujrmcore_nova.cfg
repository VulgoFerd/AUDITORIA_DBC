# Jinryuujrmcore Configuration - BigNum Patch
# Training Points and Attribute Maximum raised for large tmx values

# Attribute Maximum: set to 100000 (was 500)
# atcm (Attribute Taming Coefficient): adjusted to maintain balance at new ceiling
Attribute Maximum=100000
atcm=0.015

# Start Minus: attribute upgrade cost start minus value
Start Minus=140

# Minimum attribute upgrade cost minimum
Minimum=16

# Training Point configuration
# With long-authoritative TP (jrmcTplong), the 2e9 int cap is raised to Integer.MAX_VALUE
# tpagn (TP alignment) now uses long arithmetic via JrmcTp.addN/addI
# Negative TP gain overflow fixed with guards in handleCost and related methods

# Economics: attribute total cost ≈ 13.5 * tmx^2
# The 2e9 TP cap starts binding at tmx ≈ 12170 (with old int TP)
# With long TP and Integer.MAX_VALUE cap, binding begins at tmx ≈ 100000 (int max ~2.15e9)
# attrCst(int) stays safe up to tmx ≈ 4.77e8; planned default tmx=100000 is well within safe range
# attrCst(int[],int) (sums up to 1000 entries) overflows near tmx ≈ 1e6; tmx=100000 requires tuning

# Server and clients must run identical patched jars
# Packet format: JRMCorePStats2 now transports curTP as int (low 32 bits of long)
# Authority is NBT jrmcTplong; jrmcTpint is a saturated int mirror

# Rollback: restore original JRMCore-v1.3.51.jar and original config values
# To rollback: replace JRMCore-v1.3.51-bignum.jar with original, restore config